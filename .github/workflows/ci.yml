# CI workflow for Dōri
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: xtask check (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio/windowing dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libjack-jackd2-dev \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libgtk-3-dev gcc-mingw-w64-x86-64

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # `cargo xtask check` runs miri on the engine's `unsafe` code (the triple buffer).
      - name: Install nightly miri
        run: rustup toolchain install nightly --profile minimal --component miri,rust-src

      - name: cargo xtask check
        run: cargo xtask check

      # The pure Wayland build (no X11); see README "Wayland without X11".
      - name: cargo check without X11
        run: cargo check -p douri --no-default-features

      - name: Windows gnu check
        run: cargo check --target x86_64-pc-windows-gnu -p douri -p douri-installer

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask wasm-check
        run: cargo xtask wasm-check
