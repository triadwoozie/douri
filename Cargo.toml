[workspace]
resolver = "2"
members = [
    "crates/prowave-engine",
    "crates/prowave-project",
    "crates/prowave-app",
    "xtask",
    # The control API's command-line client and MCP server (docs/CONTROL-API.md).
    "crates/prowavectl",
]
# The CHIMERA voice engine (crates/chimera, vendored, MIT; see its NOTICE) is a path dependency,
# not a member: its upstream code is built as it is, not linted or tested as ours.
exclude = ["crates/chimera"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

# CHIMERA simulates the airway sample by sample (96 kHz inside): unoptimised, a test phrase would
# take minutes. Debug and test builds optimise it alone.
[profile.dev.package.chimera]
opt-level = 3
