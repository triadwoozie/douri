[workspace]
resolver = "2"
members = ["crates/douri-installer", "crates/prowave-app", "crates/prowave-dsp-kit", "crates/prowave-dssi", "crates/prowave-engine", "crates/prowave-exs", "crates/prowave-garageband-import", "crates/prowave-guitarpro", "crates/prowave-hydrogen-import", "crates/prowave-ladspa", "crates/prowave-logicx-import", "crates/prowave-musicxml", "crates/prowave-mxl", "crates/prowave-plugin-host", "crates/prowave-project", "crates/prowave-rex", "crates/prowave-sfz", "crates/prowave-stretch", "crates/prowave-vamp", "crates/prowave-vcs", "crates/prowavectl", "xtask"]
exclude = [
    "crates/chip-dsp",
    "crates/circuit-dsp",
    "crates/mi-dsp",
    "crates/mi-plaits-dsp",
    "crates/prowave-plug",
]

[profile.dev.package.circuit-dsp]
opt-level = 3
[profile.dev.package.mi-plaits-dsp]
opt-level = 3


[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
