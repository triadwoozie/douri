# Flatpak manifest for Dōri.
app-id: io.github.triadwoozie.douri
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: douri
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --system-talk-name=org.freedesktop.RealtimeKit1
  - --filesystem=home
modules:
  - name: douri
    buildsystem: simple
    build-commands:
      - install -D -m 755 douri /app/bin/douri
      - install -D -m 644 io.github.triadwoozie.douri.desktop /app/share/applications/io.github.triadwoozie.douri.desktop
      - install -D -m 644 io.github.triadwoozie.douri.png /app/share/icons/hicolor/512x512/apps/io.github.triadwoozie.douri.png
      - install -D -m 644 douri-mime.xml /app/share/mime/packages/io.github.triadwoozie.douri.xml
    sources:
      - type: file
        path: ../../target/release/douri
      - type: file
        path: io.github.triadwoozie.douri.desktop
      - type: file
        path: io.github.triadwoozie.douri.png
      - type: file
        path: douri-mime.xml
