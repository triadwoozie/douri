[package]
name = "prowave-vcs"
version = "0.1.0-alpha.11"
edition = "2021"
description = "Native Git version control and project alternatives engine for Dōri"
license = "GPL-3.0-or-later"

[dependencies]
prowave-project = { version = "0.1.0-alpha.11", path = "../prowave-project" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
