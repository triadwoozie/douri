[package]
name = "prowave-plugin-host"
version = "0.1.0-alpha.10"
edition = "2021"
description = "Pro Wave: CLAP, VST3 and Audio Unit plug-in hosting"
license = "GPL-3.0-or-later"

[dependencies]
libloading = "0.8"
rtrb = "0.4.0"

[features]
lv2 = ["dep:lilv", "dep:lv2_raw", "dep:lv2-sys"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
lilv = { version = "0.3.1", optional = true }
lv2_raw = { version = "0.3.2", optional = true }
lv2-sys = { version = "2.0", optional = true }

# The plug-in's own process, for this crate's tests (the app is that program in a release).
[[bin]]
name = "prowave-plugin-host"
path = "src/bin/host.rs"
test = false
